name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet: ["6.0.x", "7.0.x", "8.0.x"]
    steps:
      - uses: actions/checkout@v6
      - name: Detect-secrets baseline check
        shell: bash
        run: |
          pip install --quiet detect-secrets
          detect-secrets scan --baseline .secrets.baseline
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build
        run: dotnet build "Function Delegate.sln"

  test:
    name: Test
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test "ShellcodeRunner.Tests/ShellcodeRunner.Tests.csproj" --configuration Release --verbosity normal
